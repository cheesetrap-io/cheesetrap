name: CI - checks (auto/manual)
run-name: CI - ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'automatic' }} - ${{ github.event_name }} - ${{ github.ref_name }}
on:
  push:
    branches: [master]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir=$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXX")
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 10 --max-time 60 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scanner_dir/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scanner_dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
          test "$("$scanner_dir/gitleaks" version)" = 8.30.1
          echo "$scanner_dir" >> "$GITHUB_PATH"
      - name: Verify ignore policy and secret detection
        run: python3 -B scripts/test-secret-scan.py
      - name: Scan all fetched Git history (redacted, no uploaded report)
        run: >-
          gitleaks git --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore
          --log-opts="--all" --ignore-gitleaks-allow --redact=100
          --no-banner --no-color --timeout 120 .
  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
      GOENV: 'off'
      GOWORK: 'off'
      GOFLAGS: '-mod=readonly'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.4'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.1'
      - name: Audit locked npm dependencies without lifecycle scripts
        run: npm --prefix web audit --package-lock-only --ignore-scripts --audit-level=low
      - name: Check Go call paths on both Linux architectures
        # An npm audit failure must not hide Go findings; either failure still fails this job.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          export GOBIN="$RUNNER_TEMP/cheesetrap-vuln-tools"
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" "$GOBIN/govulncheck" ./...
          done
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOTOOLCHAIN: local
      GOENV: 'off'
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Determine verification scope
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -B scripts/ci-scope.py --event "$CI_EVENT" --base "$CI_BASE_SHA" --head "$CI_HEAD_SHA" --fetch-missing
      - name: Check documentation PR
        if: ${{ github.event_name == 'pull_request' && steps.scope.outputs.scope == 'docs' }}
        run: |
          python3 -B scripts/test-python.py unit scripts/test_operations_docs.py
          python3 -B scripts/check_links.py
          scripts/release-check.sh --metadata-only
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        if: ${{ github.event_name != 'pull_request' || steps.scope.outputs.scope != 'docs' }}
        with:
          go-version: '1.27.4'
      - name: Locate acceptance build cache
        id: go-build-cache
        if: ${{ github.event_name != 'pull_request' || steps.scope.outputs.scope != 'docs' }}
        run: |
          go_build_cache=$(go env GOCACHE)
          printf 'path=%s\n' "$go_build_cache" >> "$GITHUB_OUTPUT"
      - name: Restore application build objects from master
        id: go-build-restore
        if: ${{ github.event_name != 'pull_request' || steps.scope.outputs.scope != 'docs' }}
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.go-build-cache.outputs.path }}
          key: acceptance-go-build-v1-${{ runner.os }}-${{ runner.arch }}-1.27.4-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: acceptance-go-build-v1-${{ runner.os }}-${{ runner.arch }}-1.27.4-${{ hashFiles('go.mod', 'go.sum') }}-
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: ${{ github.event_name != 'pull_request' || steps.scope.outputs.scope != 'docs' }}
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check release metadata and tool versions
        if: ${{ github.event_name != 'pull_request' || steps.scope.outputs.scope != 'docs' }}
        run: |
          scripts/release-check.sh --metadata-only
          test "$(go env GOVERSION)" = go1.27.4
          test "$(node --version)" = v22.23.1
          test "$(npm --version)" = 10.9.8
      - name: Prepare locked Go dependencies (network allowed)
        if: ${{ github.event_name != 'pull_request' || steps.scope.outputs.scope != 'docs' }}
        run: |
          go mod download
          go mod verify
      - name: Run source and generated-code component
        if: ${{ github.event_name != 'pull_request' || steps.scope.outputs.scope != 'docs' }}
        run: scripts/test-acceptance.sh --automated-only --prepare-web --component source
      - name: Check current source component result
        if: ${{ github.event_name != 'pull_request' || steps.scope.outputs.scope != 'docs' }}
        run: |
          result=$(python3 -c 'from pathlib import Path; print(max(Path(".local/acceptance").glob("*/results.json")))')
          scripts/release-check.sh --component-results source "$result"
      - name: Refresh application build objects after successful master source checks
        id: go-build-save
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.go-build-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.go-build-cache.outputs.path }}
          key: ${{ steps.go-build-restore.outputs.cache-primary-key }}
      - name: Explain external gates
        if: always()
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_SCOPE: ${{ steps.scope.outputs.scope }}
        run: |
          if [ "$CI_EVENT" = pull_request ] && [ "$CI_SCOPE" = docs ]; then
            echo 'Documentation-only PR scope: runbook regressions, links and release metadata. Secret and dependency checks remain required. This is not PASS_AUTOMATED; the merge queue must run the complete suite before merge.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Source component covers Python, Go unit/vet, UI and generated-code checks. Complete CI also requires browser, all integration shards, Testcontainers and engines. Private evidence stays on its owning runner; actual Linux network and load verification remain separate.' >> "$GITHUB_STEP_SUMMARY"
          fi
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOTOOLCHAIN: local
      GOENV: 'off'
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Determine verification scope
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -B scripts/ci-scope.py --event "$CI_EVENT" --base "$CI_BASE_SHA" --head "$CI_HEAD_SHA" --fetch-missing
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        if: ${{ github.event_name != 'pull_request' || steps.scope.outputs.scope != 'docs' }}
        with:
          go-version: '1.27.4'
      - name: Locate browser build cache
        id: go-build-cache
        if: ${{ github.event_name != 'pull_request' || steps.scope.outputs.scope != 'docs' }}
        run: |
          go_build_cache=$(go env GOCACHE)
          printf 'path=%s\n' "$go_build_cache" >> "$GITHUB_OUTPUT"
      - name: Restore browser build objects from master
        id: go-build-restore
        if: ${{ github.event_name != 'pull_request' || steps.scope.outputs.scope != 'docs' }}
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.go-build-cache.outputs.path }}
          key: browser-go-build-v1-${{ runner.os }}-${{ runner.arch }}-1.27.4-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            browser-go-build-v1-${{ runner.os }}-${{ runner.arch }}-1.27.4-${{ hashFiles('go.mod', 'go.sum') }}-
            acceptance-go-build-v1-${{ runner.os }}-${{ runner.arch }}-1.27.4-${{ hashFiles('go.mod', 'go.sum') }}-
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: ${{ github.event_name != 'pull_request' || steps.scope.outputs.scope != 'docs' }}
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check release metadata and tool versions
        if: ${{ github.event_name != 'pull_request' || steps.scope.outputs.scope != 'docs' }}
        run: |
          scripts/release-check.sh --metadata-only
          test "$(go env GOVERSION)" = go1.27.4
          test "$(node --version)" = v22.23.1
          test "$(npm --version)" = 10.9.8
      - name: Prepare locked Go dependencies (network allowed)
        if: ${{ github.event_name != 'pull_request' || steps.scope.outputs.scope != 'docs' }}
        run: |
          go mod download
          go mod verify
      - name: Run complete E2E and browser component
        if: ${{ github.event_name != 'pull_request' || steps.scope.outputs.scope != 'docs' }}
        run: scripts/test-acceptance.sh --automated-only --prepare-web --component browser
      - name: Check current browser component result
        if: ${{ github.event_name != 'pull_request' || steps.scope.outputs.scope != 'docs' }}
        run: |
          result=$(python3 -c 'from pathlib import Path; print(max(Path(".local/acceptance").glob("*/results.json")))')
          scripts/release-check.sh --component-results browser "$result"
      - name: Refresh browser build objects after successful master browser checks
        id: go-build-save
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.go-build-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.go-build-cache.outputs.path }}
          key: ${{ steps.go-build-restore.outputs.cache-primary-key }}
      - name: Explain external gates
        if: always()
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_SCOPE: ${{ steps.scope.outputs.scope }}
        run: |
          if [ "$CI_EVENT" = pull_request ] && [ "$CI_SCOPE" = docs ]; then
            echo 'Documentation-only PR scope: E2E and browser checks run on the full merge-queue candidate.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Browser component covers every Go E2E and Chromium test through the existing isolated harness. Complete CI also requires source, all integration shards, Testcontainers and engines. Private evidence stays on its owning runner; actual Linux network and load verification remain separate.' >> "$GITHUB_STEP_SUMMARY"
          fi
  integration:
    name: integration (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        shard: [memory, jobs, retention-recovery, retention, api, other, store]
    env:
      GOTOOLCHAIN: local
      GOENV: 'off'
      GOWORK: 'off'
      CI_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Determine verification scope
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -B scripts/ci-scope.py --event "$CI_EVENT" --base "$CI_BASE_SHA" --head "$CI_HEAD_SHA" --fetch-missing
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        if: ${{ github.event_name != 'pull_request' || steps.scope.outputs.scope != 'docs' }}
        with:
          go-version: '1.27.4'
      - name: Locate integration build cache
        id: go-build-cache
        if: ${{ github.event_name != 'pull_request' || steps.scope.outputs.scope != 'docs' }}
        run: |
          go_build_cache=$(go env GOCACHE)
          printf 'path=%s\n' "$go_build_cache" >> "$GITHUB_OUTPUT"
      - name: Restore integration build objects from master
        id: go-build-restore
        if: ${{ github.event_name != 'pull_request' || steps.scope.outputs.scope != 'docs' }}
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.go-build-cache.outputs.path }}
          key: integration-${{ matrix.shard }}-go-build-v1-${{ runner.os }}-${{ runner.arch }}-1.27.4-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            integration-${{ matrix.shard }}-go-build-v1-${{ runner.os }}-${{ runner.arch }}-1.27.4-${{ hashFiles('go.mod', 'go.sum') }}-
            integration-jobs-go-build-v1-${{ runner.os }}-${{ runner.arch }}-1.27.4-${{ hashFiles('go.mod', 'go.sum') }}-
            integration-other-go-build-v1-${{ runner.os }}-${{ runner.arch }}-1.27.4-${{ hashFiles('go.mod', 'go.sum') }}-
            integration-go-build-v1-${{ runner.os }}-${{ runner.arch }}-1.27.4-${{ hashFiles('go.mod', 'go.sum') }}-
            acceptance-go-build-v1-${{ runner.os }}-${{ runner.arch }}-1.27.4-${{ hashFiles('go.mod', 'go.sum') }}-
      - name: Check metadata and prepare locked Go dependencies
        if: ${{ github.event_name != 'pull_request' || steps.scope.outputs.scope != 'docs' }}
        run: |
          scripts/release-check.sh --metadata-only
          test "$(go env GOVERSION)" = go1.27.4
          go mod download
          go mod verify
      - name: Run required Go integration shard
        if: ${{ github.event_name != 'pull_request' || steps.scope.outputs.scope != 'docs' }}
        run: scripts/test-acceptance.sh --automated-only --component integration --integration-shard "$CI_SHARD"
      - name: Check current integration component result
        if: ${{ github.event_name != 'pull_request' || steps.scope.outputs.scope != 'docs' }}
        run: |
          result=$(python3 -c 'from pathlib import Path; print(max(Path(".local/acceptance").glob("*/results.json")))')
          scripts/release-check.sh --component-results integration "$result" --integration-shard "$CI_SHARD"
      - name: Refresh integration build objects after successful master checks
        id: go-build-save
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.go-build-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.go-build-cache.outputs.path }}
          key: ${{ steps.go-build-restore.outputs.cache-primary-key }}
      - name: Explain external gates
        if: always()
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_SCOPE: ${{ steps.scope.outputs.scope }}
        run: |
          if [ "$CI_EVENT" = pull_request ] && [ "$CI_SCOPE" = docs ]; then
            echo 'Documentation-only PR scope: full Go integration runs in the enforced merge queue.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Every integration shard remains required, including the separate retention recovery test with both original 20-second horizons. Complete CI requires all seven shards, source, browser, Testcontainers and engines. Each stack retains its existing limits and independent cleanup; private evidence is never exchanged between runners.' >> "$GITHUB_STEP_SUMMARY"
          fi
  testcontainers:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOTOOLCHAIN: local
      GOENV: 'off'
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Determine verification scope
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -B scripts/ci-scope.py --event "$CI_EVENT" --base "$CI_BASE_SHA" --head "$CI_HEAD_SHA" --fetch-missing
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        if: ${{ github.event_name != 'pull_request' || steps.scope.outputs.scope != 'docs' }}
        with:
          go-version: '1.27.4'
      - name: Prepare locked Go dependencies
        if: ${{ github.event_name != 'pull_request' || steps.scope.outputs.scope != 'docs' }}
        run: |
          go mod download
          go mod verify
      - name: Verify Testcontainers loopback ports and locked Ryuk image
        if: ${{ github.event_name != 'pull_request' || steps.scope.outputs.scope != 'docs' }}
        run: python3 -B scripts/test-testcontainers.py
      - name: Explain external gates
        if: always()
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_SCOPE: ${{ steps.scope.outputs.scope }}
        run: |
          if [ "$CI_EVENT" = pull_request ] && [ "$CI_SCOPE" = docs ]; then
            echo 'Documentation-only PR scope: live Testcontainers verification runs on the full merge-queue candidate.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Live Testcontainers checks remain required by the automated verdict. Each runner uses its own disposable Docker resources.' >> "$GITHUB_STEP_SUMMARY"
          fi
  engines:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Determine verification scope
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -B scripts/ci-scope.py --event "$CI_EVENT" --base "$CI_BASE_SHA" --head "$CI_HEAD_SHA" --fetch-missing
      - name: Build pinned images
        if: ${{ github.event_name != 'pull_request' || steps.scope.outputs.scope != 'docs' }}
        run: |
          docker build -f deploy/Dockerfile -t cheesetrap:ci .
          docker build --target patched -t cheesetrap-web:ci sensors/web
      - name: Test pinned engine Python boundaries and real reactor
        if: ${{ github.event_name != 'pull_request' || steps.scope.outputs.scope != 'docs' }}
        timeout-minutes: 5
        run: python3 -B scripts/test-python.py image --image cheesetrap-web:ci
      - name: Explain external gates
        if: always()
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_SCOPE: ${{ steps.scope.outputs.scope }}
        run: |
          if [ "$CI_EVENT" = pull_request ] && [ "$CI_SCOPE" = docs ]; then
            echo 'Documentation-only PR scope: image builds and engine checks run on the full merge-queue candidate.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Both pinned image builds and Python engine boundaries/reactor checks remain required by the automated verdict. Private logs are never uploaded.' >> "$GITHUB_STEP_SUMMARY"
          fi
  automated:
    needs: [acceptance, browser, integration, testcontainers, engines]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all automated work
        env:
          ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          CONTAINERS_RESULT: ${{ needs.testcontainers.result }}
          ENGINES_RESULT: ${{ needs.engines.result }}
        run: |
          set -euo pipefail
          if [ "$ACCEPTANCE_RESULT" != success ] || [ "$BROWSER_RESULT" != success ] || [ "$INTEGRATION_RESULT" != success ] || [ "$CONTAINERS_RESULT" != success ] || [ "$ENGINES_RESULT" != success ]; then
            echo 'CI_VERDICT FAIL'
            exit 1
          fi
          echo 'CI_VERDICT PASS'
